version: 2

sources:
  - name: db_silver
    schema: silver
    tables:
      - name: ecommerce_events
        description: "Cleaned clickstream and enriched CRM events at the Silver layer."
        columns:
          - name: event_time
            tests:
              - not_null
          - name: event_type
            tests:
              - not_null
          - name: user_id
            tests:
              - not_null
          - name: product_id
            tests:
              - not_null
          - name: price
            tests:
              - not_null

  - name: db_crm
    schema: crm
    tables:
      - name: user_loyalty
        description: "Customer loyalty tier and acquisition profile from Neon CRM."
        columns:
          - name: user_id
            tests:
              - not_null
              - unique
          - name: loyalty_tier
            tests:
              - not_null

models:
  - name: dim_users_loyalty
    description: "User dimension table integrating loyalty tiers and session activity metrics."
    columns:
      - name: user_id
        description: "Unique identifier for the user."
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Product dimension table with cleaned category and brand hierarchies."
    columns:
      - name: product_id
        description: "Unique identifier for the product."
        tests:
          - unique
          - not_null

  - name: fact_sales
    description: "Fact table recording completed purchase transactions."
    columns:
      - name: sale_id
        description: "Unique surrogate key for the sale transaction."
        tests:
          - unique
          - not_null

  - name: fact_cart_abandonment
    description: "Fact table tracking cart additions without subsequent purchases."
    columns:
      - name: abandonment_id
        description: "Unique surrogate key for the cart abandonment event."
        tests:
          - unique
          - not_null
